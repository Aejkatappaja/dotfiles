# kintsugi-flared theme data (sourced by bin/theme)
#
# Only nvim, ghostty and jankyborders are actually kintsugi. No kintsugi variant
# exists yet for bat/btop/yazi/hunk/lazygit/delta/opencode/obsidian/vim, so
# PALETTE stays on cendre and those tools keep their cendre files instead of
# warning on every switch. tmux has its own block in tokyo-night-tmux/src/themes.sh.
PALETTE="cendre"
TMUX_THEME="kintsugi-flared"
TMUX_MODE="fg=#dddddd,bg=#2f241d"
TMUX_BORDER="#2a2a28"
NVIM_CS="kintsugi-gram" # local colors/kintsugi-gram.lua, no plugin involved
GHOSTTY_THEME="kintsugi-flared"
BORDER_COLOR="0xFFE08542"
HL_COLOR="#E08542"
OBS_THEME="cendre"
WALLPAPER="tangerines.jpg" # placeholder: same wallpaper as cendre
VIM_CS="cendre"
GRAM_THEME="Kintsugi Dark Flared"
