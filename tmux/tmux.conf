unbind r
bind r source-file ~/.config/tmux/tmux.conf;

set -g default-terminal "tmux-256color"

set -g mouse on

set -g allow-rename on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
setw -g monitor-activity on
set-option -g status-left-length 200
set-option -g status-left " #{session_name}  "
set-option -g status-right " "
set-option -g status-style "bg=default"
set-option -g status-position bottom
set -g status-style 'bg=default fg=#5eacd3'

# # Status line customisation
set-option -g status-left-length 200
set-option -g status-left " #{session_name}  "

# add git branch to status line
set-option -g status-style "bg=default"
set -g status-right "#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD) "
set-option -g window-status-format "#{window_index}:#{window_name}#{window_flags} "
set-option -g window-status-current-format "#{window_index}:#{window_name}#{window_flags} "
set-option -g window-status-current-style "fg=#e1a345"
set-option -g window-status-last-style "fg=#936a2e"
set-option -g window-status-activity-style none

set -g status-justify left

set -g renumber-windows on

bind-key -T prefix t set-option -g status

##### Display Popups #####

# bind C-o popup -E -d "#{pane_current_path}" -w 90% -h 90% "opencode"
# bind C-o popup -E -d "#{pane_current_path}" -w 90% -h 90% "claude"

bind -r o run-shell '\
  SESSION="claude-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "claude"; \
  tmux display-popup -w80% -h80% -E "tmux attach-session -t $SESSION"'

bind y display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"
bind j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind z display-popup \
  -w 80% \
  -h 80% \
  -E 'nvim ~/.zshrc'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# Theme: switch between "sora" and "night" (default tokyonight)
set -g @plugin 'janoamaral/tokyo-night-tmux'
set -g @tokyo-night-tmux_theme "sora"
set -g @tokyo-night-tmux_transparent 1
set -g @tokyo-night-tmux_show_datetime 0

run '~/.tmux/plugins/tpm/tpm'

# Copy-mode selection (theme-switched by ~/.config/bin/theme).
set -g mode-style "fg=#c8d0e0,bg=#1e2430"
